<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gabi.app</title>
    
    <!-- Core meta tags -->
    <meta name="title" content="Gabi.app">
    <meta name="description" content="Random useless facts with Material You 3 design.">
    <meta name="keywords" content="useless facts, random facts, fun facts, trivia">
    <meta name="author" content="Gabi.app">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    <meta name="theme-color" content="#8D4A5A" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#191113" media="(prefers-color-scheme: dark)">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gabi-app.pages.dev/">
    <meta property="og:title" content="Gabi.app">
    <meta property="og:description" content="Random useless facts with Material You 3 design.">
    <meta property="og:image" content="icon.svg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gabi-app.pages.dev/">
    <meta property="twitter:title" content="Gabi.app">
    <meta property="twitter:description" content="Random useless facts with Material You 3 design.">
    <meta property="twitter:image" content="icon.svg">
    
    <!-- MS Tile / Windows -->
    <meta name="msapplication-TileColor" content="#8D4A5A">
    <meta name="msapplication-TileImage" content="icon.svg">
    <meta name="msapplication-square70x70logo" content="icon.svg">
    <meta name="msapplication-square150x150logo" content="icon.svg">
    <meta name="msapplication-wide310x150logo" content="icon.svg">
    <meta name="msapplication-square310x310logo" content="icon.svg">
    <meta name="msapplication-config" content="none">
    
    <!-- Apple / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gabi.app">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="mask-icon" href="icon.svg" color="#8D4A5A">
    
    <!-- Favicon / All browsers -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="application-name" content="Gabi.app">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://gabi-app.pages.dev/">
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        :root {
            --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
            --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
            --md-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px 0px rgba(0,0,0,0.30);
        }
        .theme-light {
            --md-primary: #8D4A5A;
            --md-on-primary: #FFFFFF;
            --md-primary-container: #FFD9DF;
            --md-on-primary-container: #713343;
            --md-secondary: #75565C;
            --md-on-secondary: #FFFFFF;
            --md-secondary-container: #FFD9DF;
            --md-on-secondary-container: #5B3F45;
            --md-background: #FFF8F7;
            --md-on-background: #22191B;
            --md-surface: #FFF8F7;
            --md-on-surface: #22191B;
            --md-surface-variant: #F3DDE0;
            --md-on-surface-variant: #524346;
            --md-outline: #847375;
            --md-outline-variant: #D6C2C4;
            --md-error: #BA1A1A;
            --md-on-error: #FFFFFF;
        }
        .theme-dark {
            --md-primary: #FFB1C2;
            --md-on-primary: #551D2D;
            --md-primary-container: #713343;
            --md-on-primary-container: #FFD9DF;
            --md-secondary: #E4BDC3;
            --md-on-secondary: #43292F;
            --md-secondary-container: #5B3F45;
            --md-on-secondary-container: #FFD9DF;
            --md-background: #191113;
            --md-on-background: #EFDEE0;
            --md-surface: #191113;
            --md-on-surface: #EFDEE0;
            --md-surface-variant: #524346;
            --md-on-surface-variant: #D6C2C4;
            --md-outline: #9E8C8F;
            --md-outline-variant: #524346;
            --md-error: #FFB4AB;
        }
        body {
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            background-color: var(--md-background);
            color: var(--md-on-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        .appbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            border-radius: 32px 32px 16px 16px;
            margin-bottom: 24px;
            box-shadow: var(--md-elevation-1);
        }
        .appbar-start {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .appbar-icon {
            font-size: 28px;
            color: var(--md-primary);
        }
        .appbar-title {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--md-on-surface);
        }
        .menu-button {
            cursor: pointer;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            color: var(--md-outline);
        }
        .menu-button:hover {
            background-color: var(--md-surface-variant);
        }
        .menu-dropdown {
            position: relative;
        }
        .menu-items {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: var(--md-surface-variant);
            border-radius: 28px;
            box-shadow: var(--md-elevation-3);
            padding: 8px;
            min-width: 180px;
            z-index: 1000;
            display: none;
            border: 1px solid var(--md-outline-variant);
        }
        .menu-items.show {
            display: block;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--md-on-surface);
            transition: background-color 0.2s;
        }
        .menu-item:hover {
            background-color: var(--md-outline-variant);
        }
        .menu-item .material-symbols-outlined {
            font-size: 20px;
            color: var(--md-primary);
        }
        .fact-card {
            background-color: var(--md-surface);
            border-radius: 32px;
            padding: 32px 24px;
            margin-bottom: 24px;
            box-shadow: var(--md-elevation-3);
        }
        .fact-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            color: var(--md-primary);
        }
        .fact-header .material-symbols-outlined {
            font-size: 32px;
        }
        .fact-header h2 {
            font-size: 1.4rem;
            font-weight: 500;
            margin: 0;
            color: var(--md-on-surface);
        }
        .fact-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 400;
            margin-bottom: 32px;
            color: var(--md-on-surface);
            word-break: break-word;
            min-height: 4rem;
        }
        .fact-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .source-chip {
            display: inline-flex;
            align-items: center;
            background-color: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            gap: 8px;
        }
        .source-chip .material-symbols-outlined {
            font-size: 18px;
        }
        .button {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: 40px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: var(--md-elevation-1);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.1s;
            font-family: 'Roboto', sans-serif;
        }
        .button:hover {
            box-shadow: var(--md-elevation-2);
        }
        .button:active {
            transform: scale(0.97);
        }
        .button .material-symbols-outlined {
            font-size: 20px;
        }
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .footer-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 36px;
            font-size: 0.85rem;
            color: var(--md-outline);
        }
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid var(--md-primary);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--md-on-surface-variant);
        }
        .hidden {
            display: none !important;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--md-surface-variant);
            color: var(--md-on-surface);
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: var(--md-elevation-2);
            z-index: 2000;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show {
            display: block;
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="theme-light">
    <div class="app-container">
        <div class="appbar">
            <div class="appbar-start">
                <span class="material-symbols-outlined appbar-icon">spa</span>
                <span class="appbar-title">Gabi.app</span>
            </div>
            <div class="menu-dropdown">
                <div class="menu-button" id="menuButton">
                    <span class="material-symbols-outlined">more_vert</span>
                </div>
                <div class="menu-items" id="menuItems">
                    <div class="menu-item" id="themeToggle">
                        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
                        <span id="themeText">Dark mode</span>
                    </div>
                    <div class="menu-item" id="installButton" style="display: none;">
                        <span class="material-symbols-outlined">download</span>
                        <span>Install app</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="fact-card">
            <div class="fact-header">
                <span class="material-symbols-outlined">psychology_alt</span>
                <h2>Random useless fact</h2>
            </div>
            <div id="factDisplay">
                <div class="fact-text" id="factText">Gabi is ready..</div>
            </div>
            <div id="loadingIndicator" class="loading-container hidden">
                <div class="loader"></div>
                <span>Gabi is finding....</span>
            </div>
            <div class="fact-actions">
                <div class="source-chip">
                    <span class="material-symbols-outlined">database</span>
                    <span>Useless Facts API</span>
                </div>
                <div class="button-group">
                    <button class="button" id="shareBtn">
                        <span class="material-symbols-outlined">share</span>
                        <span>Share</span>
                    </button>
                    <button class="button" id="refreshBtn">
                        <span class="material-symbols-outlined">autorenew</span>
                        <span>New fact</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="footer-note">
            <span class="material-symbols-outlined" style="font-size: 16px;">spa</span>
            <span>© 2026 | Gabi.app™</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const factText = document.getElementById('factText');
            const refreshBtn = document.getElementById('refreshBtn');
            const shareBtn = document.getElementById('shareBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const factDisplay = document.getElementById('factDisplay');
            const menuButton = document.getElementById('menuButton');
            const menuItems = document.getElementById('menuItems');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            const installButton = document.getElementById('installButton');
            const toast = document.getElementById('toast');
            const body = document.body;
            const API_BASE_URL = 'https://useless.endroid.worker.dev/api/v1';
            const STORAGE_KEY = 'gabi-theme';
            
            let currentFactId = null;
            let deferredPrompt;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            function setTheme(theme) {
                body.classList.remove('theme-light', 'theme-dark');
                body.classList.add(`theme-${theme}`);
                localStorage.setItem(STORAGE_KEY, theme);
                const isDark = theme === 'dark';
                themeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
                themeText.textContent = isDark ? 'Light mode' : 'Dark mode';
            }

            function toggleTheme() {
                const currentTheme = body.classList.contains('theme-dark') ? 'dark' : 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
            }

            function toggleMenu(e) {
                e.stopPropagation();
                menuItems.classList.toggle('show');
            }

            function closeMenu() {
                menuItems.classList.remove('show');
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    factDisplay.classList.add('hidden');
                    loadingIndicator.classList.remove('hidden');
                } else {
                    factDisplay.classList.remove('hidden');
                    loadingIndicator.classList.add('hidden');
                }
            }

            async function fetchFact(factId = null) {
                setLoading(true);
                try {
                    const url = factId ? `${API_BASE_URL}/${factId}` : API_BASE_URL;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        factText.innerText = '⚠️ Fact not found';
                        currentFactId = null;
                    } else {
                        factText.innerText = data.text;
                        currentFactId = data.id;
                    }
                } catch (error) {
                    console.error('Fetch failed:', error);
                    factText.innerText = '⚠️ Could not reach uselessness';
                    currentFactId = null;
                } finally {
                    setLoading(false);
                }
            }

            function shareCurrentFact() {
                if (!currentFactId) {
                    showToast('Load a fact first!');
                    return;
                }
                
                const shareUrl = `${window.location.origin}/shared/${currentFactId}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'Gabi.app',
                        text: factText.innerText,
                        url: shareUrl,
                    }).catch(err => console.log('Share cancelled:', err));
                } else {
                    // Fallback: copy to clipboard
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        showToast('Link copied! 📋');
                    }).catch(err => {
                        showToast('Could not copy link');
                        console.error('Copy failed:', err);
                    });
                }
            }

            function checkSharedUrl() {
                const path = window.location.pathname;
                const match = path.match(/^\/shared\/(\d+)\/?$/);
                
                if (match) {
                    const factId = parseInt(match[1]);
                    fetchFact(factId);
                }
            }

            // Event listeners
            menuButton.addEventListener('click', toggleMenu);
            document.addEventListener('click', (e) => {
                if (!menuButton.contains(e.target) && !menuItems.contains(e.target)) {
                    closeMenu();
                }
            });
            
            themeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTheme();
                closeMenu();
            });

            refreshBtn.addEventListener('click', () => fetchFact());
            shareBtn.addEventListener('click', shareCurrentFact);

            // PWA installation
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installButton.style.display = 'flex';
            });
            
            installButton.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('Install outcome:', outcome);
                deferredPrompt = null;
                installButton.style.display = 'none';
            });

            // Initialize
            const savedTheme = localStorage.getItem(STORAGE_KEY) || 'light';
            setTheme(savedTheme);
            
            checkSharedUrl();
            
            window.addEventListener('load', () => {
                setTimeout(() => {
                    if (!currentFactId) fetchFact();
                }, 120);
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(err => {
                        console.log('Service Worker failed:', err);
                    });
                });
            }
        })();
    </script>
</body>
</html>
